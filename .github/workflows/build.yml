name: Build YouPlay APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'   # the default also installs the removed 'tools' package, which now fails

      - name: Accept SDK licenses and install platform 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" || sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: YouPlay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode release keystore
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No KEYSTORE_BASE64 secret set; skipping signed release build."
          fi

      - name: Build signed release APK
        if: steps.ks.outputs.file != ''
        env:
          KEYSTORE_FILE: ${{ steps.ks.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace
          mkdir -p out && cp app/build/outputs/apk/release/*.apk "out/YouPlay-v1.0.${GITHUB_RUN_NUMBER}.apk"

      - name: Upload release APK
        if: steps.ks.outputs.file != ''
        uses: actions/upload-artifact@v4
        with:
          name: YouPlay-release-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.ks.outputs.file != '' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${GITHUB_RUN_NUMBER}" out/*.apk \
            --title "YouPlay v1.0.${GITHUB_RUN_NUMBER}" \
            --notes "Signed release build from ${GITHUB_SHA::7}." --latest

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports
            **/build/reports/problems
          if-no-files-found: ignore
